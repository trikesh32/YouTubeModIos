name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s vendor/ytkace/Tests -p 'test_*.py'
  module:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/project.py build
      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeMod-experimental-kit
          path: build/kit/
          if-no-files-found: error
